# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - apireabilitate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
 test-angular:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies for Angular
        run: |
          cd Identity/client
          npm install -g @angular/cli
          npm install

      - name: Run Angular tests
        run: |
          cd Identity/client
          ng test --watch=false --browsers=ChromeHeadless --code-coverage
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: angular-coverage-report
          path: Identity/client/coverage
          
build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.x'
          include-prerelease: true

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish server/Identity.webapi/Identity.webapi.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  trivy-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Trivy
      run: |
        wget https://github.com/aquasecurity/trivy/releases/download/v0.40.0/trivy_0.40.0_Linux-64bit.deb
        sudo dpkg -i trivy_0.40.0_Linux-64bit.deb
        wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
        sudo cp html.tpl /usr/bin/html.tpl

    - name: Run Trivy scan on Docker image
      run: |
        docker build -t identity .
        trivy image --format template --template "@/usr/bin/html.tpl" -o trivy-report.html identity

    - name: Upload Trivy report
      uses: actions/upload-artifact@v3
      with:
        name: trivy-report
        path: trivy-report.html

  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.x'
          include-prerelease: true

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER

    # Passo para instalar Docker Compose
      - name: Install Docker Compose
        run: |
          DOCKER_COMPOSE_VERSION=1.29.2
          sudo curl -L "https://github.com/docker/compose/releases/download/$DOCKER_COMPOSE_VERSION/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verifica se o Docker Compose foi instalado corretamente

      - name: Run Docker Compose
        run: |
          docker-compose up -d

      - name: Rodar Benchmark testes
        run: |
         dotnet run --project tests/Identity.Benchmark.Tests/Identity.Benchmark.Tests.csproj -c Release
 
      - name: Publicar resultados dos testes de benchmark
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: BenchmarkDotNet.Artifacts
          path: BenchmarkDotNet.Artifacts/

  Unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Listar arquivos
        if: always()
        run: |
          echo "Arquivos:"
          ls -R
          
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Rodar UNIT testes
        run: |
          dotnet tool install --global coverlet.console
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet test tests/Identity.Unit.Tests/Identity.Unit.Tests.csproj --verbosity minimal --collect:"XPlat Code Coverage"


      - name: Relatorio UNit tests 
        if: always()
        run: |
          reportgenerator "-reports:**/**/coverage.cobertura.xml" "-targetdir:coveragereport" -reporttypes:Html
          ls -R
          
      - name: Publicar resultados dos testes unitarios
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: coveragereport/
          
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.x'
          include-prerelease: true

    # Passo para instalar Docker
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER

    # Passo para instalar Docker Compose
      - name: Install Docker Compose
        run: |
          DOCKER_COMPOSE_VERSION=1.29.2
          sudo curl -L "https://github.com/docker/compose/releases/download/$DOCKER_COMPOSE_VERSION/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verifica se o Docker Compose foi instalado corretamente

          
      - name: Rodar E2E testes
        run: |
          dotnet test tests/Identity.SpecFlow.Tests/Identity.SpecFlow.Tests.csproj \
          --logger "trx;LogFileName=test-results.trx" # Gerando arquivo de resultados no formato TRX

      # Publicar os resultados dos testes (Arquivo TRX)
      - name: Publicar resultados dos testes
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: tests/Identity.SpecFlow.Tests/TestResults/test-results.trx
          
      - name: Living Docs HTML
        if: always()
        run: |
          dotnet tool install --global SpecFlow.Plus.LivingDoc.CLI
          livingdoc test-assembly tests/Identity.SpecFlow.Tests/bin/Debug/net6.0/Identity.SpecFlow.Tests.dll -t tests/Identity.SpecFlow.Tests/bin/Debug/net6.0/TestExecution.json --project-language pt-br

      - name: Publicar resultados Living Docs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: LivingDocs-results
          path: LivingDoc.html


      - name: Publicar vídeos gerados
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: videos
          path: videos/* # Todos os arquivos dentro da pasta "videos"

  deploy:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'apireabilitate'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_87F529B45A86452A86399270218E26CD }}
          package: .
