<div class="change-password-container">
  <form class="change-password-form" [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
    <h2>Alterar Senha</h2>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" formControlName="email" type="email" placeholder="Digite seu e-mail" required />
    </div>

    <div class="form-group">
      <label for="newPassword">Nova Senha</label>
      <input id="newPassword" formControlName="newPassword" type="password" placeholder="Digite sua nova senha" required />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar Senha</label>
      <input id="confirmPassword" formControlName="confirmPassword" type="password" placeholder="Confirme sua nova senha" required />
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <button type="submit" class="btn-submit" [disabled]="loading">Alterar Senha</button>
  </form>
</div>
