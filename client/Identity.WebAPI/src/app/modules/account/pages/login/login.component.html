<div class="auth-container">
    <div class="auth-form">
      <h2>Login</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input formControlName="email" type="email" id="email" placeholder="Digite seu e-mail" required />
        </div>
  
        <div class="form-group">
          <label for="password">Senha</label>
          <input formControlName="password" type="password" id="password" placeholder="Digite sua senha" required />
        </div>
  
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
      <p class="register-link">Não tem uma conta? <a routerLink="/account/register">Cadastre-se</a></p>
      <p class="forgot-password"><a routerLink="/account/forgot-password">Esqueceu a senha?</a></p>
    </div>
  </div>
