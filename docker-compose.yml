# # senha padrao do seleniumhub é :secret
services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: database
    ports:
      - "1433:1433"
    volumes:
    - dbdata:/var/opt/mssql
    environment:
      MSSQL_TCP_PORT: 1433
      MSSQL_SA_PASSWORD: "P@55w0rd"
      ACCEPT_EULA: "Y"
    networks:
      - identityNetwork

  identity-webapi:
    container_name: identity-WebApi
    build: 
      context: .
    ports:
      - "5000:8081"
      - "5001:8080"
    # environment:
    #   - ENVIRONMENT_NAME=Test
    #   - ASPNETCORE_ENVIRONMENT=Test
    networks:
      - identityNetwork

  identity-webapp:
    container_name: identity.WebApp
    build: 
      context: client/Identity.WebAPI/
      dockerfile: dockerfile
    ports:
      - "4200:80"
    environment:
      - ENVIRONMENT_NAME=Test
    networks:
      - identityNetwork

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - identityNetwork


  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000" # Porta Blob
      - "10001:10001" # Porta Queue
      - "10002:10002" # Porta Table
    volumes:
      - azurite-data:/data
    networks:
      - identityNetwork
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

  # fidelidade-autenticacao-webapi:
  #   container_name: loyalty.autenticacao.WebApi
  #   image:  acrfidelidadehml.azurecr.io/apiautenticacaohml:latest
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Test
  #   ports:
  #     - "5007:80"
  #     - "5008:443"
  #   networks:
  #     - identityNetwork
  #   healthcheck:
  #     test: ["CMD", "curl", "--silent", "--fail", "http://localhost:80/health"]
  #     interval: 30s
  #     retries: 3
  #     start_period: 30s
  #     timeout: 10s

  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442-4444:4442-4444"
    networks:
      - identityNetwork

  chrome-node:
    image: selenium/node-chrome:latest
    container_name: selenium-node-chrome
    shm_size: 2g
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on:
      - selenium-hub
    networks:
      - identityNetwork

  firefox-node:
    image: selenium/node-firefox:latest
    container_name: selenium-node-firefox
    shm_size: 2g
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on:
      - selenium-hub
    networks:
      - identityNetwork

  edge-node:
    image: selenium/node-edge:latest
    container_name: selenium-node-edge
    shm_size: 2g
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on:
      - selenium-hub
    networks:
      - identityNetwork

networks:
  identityNetwork:
    driver: bridge
    
volumes:
  azurite-data:
  dbdata:
  redis-data:
    driver: local

